# Nome do workflow que aparece na interface do GitHub Actions
name: "Lab 05 - Variaveis, Secrets e Environments"
 
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente a usar neste run'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - homologacao
          - producao
 
# env no nível do WORKFLOW: vale como padrão pra todos os jobs,
# a menos que algo mais específico sobrescreva
env:
  APP_NAME: "lab-05-demo"
  LOG_LEVEL: "info"
 
jobs:
  demonstrar-precedencia:
    name: "1) Precedência de env (workflow -> job -> step)"
    runs-on: ubuntu-latest
    # env no nível do JOB: sobrescreve o LOG_LEVEL do workflow,
    # mas só dentro deste job
    env:
      LOG_LEVEL: "warn"
    steps:
      - name: Mostrar herança sem sobrescrita no step
        run: |
          echo "=== SEM SOBRESCRITA NO STEP ==="
          echo "APP_NAME (vem do workflow): $APP_NAME"
          echo "LOG_LEVEL (vem do job, sobrescreveu o workflow): $LOG_LEVEL"