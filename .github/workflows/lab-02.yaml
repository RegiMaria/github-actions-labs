name: "Lab 02 - Eventos de Trigger"

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '!scripts/rascunhos/**'

  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente de execução'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      rodar_testes:
        description: 'Executar testes antes do ETL?'
        required: false
        default: true
        type: boolean

  # NOVO: gatilho agendado
  schedule:
    - cron: '0 2 * * 1-5'   # segunda a sexta, 2h da manhã (UTC)

env:
  PYTHON_VERSION: '3.12'

jobs:
  demonstrar-triggers:
    name: "Demonstrar Eventos de Trigger"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Identificar o evento que disparou o workflow
        run: |
          echo "=== EVENTO DE TRIGGER ==="
          echo "Nome do evento: ${{ github.event_name }}"
          echo "Branch/ref: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"

      - name: Mostrar inputs (apenas em execução manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "=== INPUTS RECEBIDOS ==="
          echo "Ambiente escolhido: ${{ inputs.ambiente }}"
          echo "Rodar testes: ${{ inputs.rodar_testes }}"

      # NOVO: condicional combinando os 3 eventos
      - name: Rodar testes (condicional)
        if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.rodar_testes == true)
        run: |
          echo "=== RODANDO TESTES ==="
          echo "Testes executariam aqui (ex: pytest)"