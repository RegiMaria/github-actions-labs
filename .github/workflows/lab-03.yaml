# Nome do workflow que aparece na interface do GitHub Actions
name: "Lab 03 - Jobs em Paralelo e Dependências (needs)"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ============================================
  # JOB 1: lint - roda em paralelo com o JOB 2
  # ============================================
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Simular lint
        run: |
          echo "=== JOB: LINT ==="
          echo "Iniciado em: $(date)"
          echo "Rodaria aqui: flake8 scripts/ ou ruff check scripts/"
          sleep 5   # simula um lint que demora um pouco, só pra ver o paralelismo no log
          echo "Lint finalizado em: $(date)"

  # ============================================
  # JOB 2: test - roda em paralelo com o JOB 1
  # (nenhum dos dois espera o outro, porque
  #  nenhum tem "needs" apontando pro outro)
  # ============================================
  test:
    name: "Testes"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Simular testes
        run: |
          echo "=== JOB: TESTES ==="
          echo "Iniciado em: $(date)"
          echo "Rodaria aqui: pytest -v"
          sleep 8   # simula testes que demoram um pouco mais que o lint
          echo "Testes finalizados em: $(date)"

  # ============================================
  # JOB 3: build - só roda DEPOIS que lint E test
  # terminarem com sucesso (needs: [lint, test])
  # ============================================
  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: [ lint, test ]   # <- é isso que cria a dependência entre jobs
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Simular build
        run: |
          echo "=== JOB: BUILD ==="
          echo "Iniciado em: $(date)"
          echo "Só chegou aqui porque lint E test já passaram."
          echo "Rodaria aqui: python -m build"

  